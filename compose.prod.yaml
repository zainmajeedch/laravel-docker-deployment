services:

  php:
    image: ghcr.io/zainmajeedch/laravel-docker-php:1.0
    container_name: laravel-php
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8082

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_password

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

    volumes:
      - laravel_storage:/var/www/html/storage

    networks:
      - laravel-network

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/zainmajeedch/laravel-docker-nginx:1.0
    container_name: laravel-nginx
    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - laravel_storage:/var/www/html/storage:ro

    depends_on:
      php:
        condition: service_healthy

    networks:
      - laravel-network

    healthcheck:
      test: ["CMD-SHELL", "nginx -t && exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s


  mariadb:
    image: mariadb:11
    container_name: laravel-mariadb
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel_password
      MARIADB_ROOT_PASSWORD: root_password

    volumes:
      - laravel_mariadb_data:/var/lib/mysql

    networks:
      - laravel-network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped

    volumes:
      - laravel_redis_data:/data

    networks:
      - laravel-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  laravel-network:
    driver: bridge


volumes:
  laravel_storage:
  laravel_mariadb_data:
  laravel_redis_data:
